# version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: local_asflasuojo_db
    restart: always
    environment:
      POSTGRES_USER: dev_user_asflasuojo
      POSTGRES_PASSWORD: dev_password_asflasuojo
      POSTGRES_DB: asflasuojo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    
